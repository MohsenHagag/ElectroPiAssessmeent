name: Electro Pi QA Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  api-tests:
    name: API Tests (Postman / Newman)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman + HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: |
          newman run MohsenHaggag_ElectroPi.postman_collection.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report/report.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report/

  ui-tests:
    name: UI Tests (Selenium + TestNG)
    runs-on: ubuntu-latest
    needs: api-tests   # only run the slower UI suite once the API layer is confirmed healthy
    defaults:
      run:
        working-directory: MohsenHaggag_ElectroPi   # pom.xml lives in this subfolder, not the repo root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('MohsenHaggag_ElectroPi/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Selenium/TestNG suite (headless)
        run: mvn -B test -Dheadless=true

      - name: Upload TestNG / Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            MohsenHaggag_ElectroPi/test-output/
